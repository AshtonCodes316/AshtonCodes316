name: Portfolio browser screenshots
on:
  pull_request:
    paths:
      - '.github/workflows/portfolio-screenshots.yml'
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser tooling
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Capture actual rendered local site and check layouts
        run: python scripts/capture_portfolio.py
      - name: Upload desktop and mobile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-evidence
          path: browser-evidence/
          if-no-files-found: error
