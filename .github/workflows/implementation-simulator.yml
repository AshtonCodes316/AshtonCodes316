name: Customer implementation simulator
on:
  push:
    paths:
      - 'examples/implementation-simulator/**'
      - '.github/workflows/implementation-simulator.yml'
  pull_request:
    paths:
      - 'examples/implementation-simulator/**'
      - '.github/workflows/implementation-simulator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify simulated implementation
        working-directory: examples/implementation-simulator
        run: |
          python3 -m unittest discover -v
          python3 simulator.py
